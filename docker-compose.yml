services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: velvetstream
      POSTGRES_USER: velvetstream
      POSTGRES_PASSWORD: velvetstream
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velvetstream -d velvetstream"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgres://velvetstream:velvetstream@db:5432/velvetstream
      PGSSL: disable
      JWT_SECRET: change-this-to-a-long-random-secret-before-public-use
      MAX_VIDEO_BYTES: 536870912
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    ports:
      - "3000:3000"
    command: sh -c "node scripts/init-db.js && node server.js"
volumes:
  postgres_data:
